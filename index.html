<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电致变色器件 (ECD) - 交互式3D模型</title>
<style>
  :root {
    --bg: #0a0a14;
    --panel-bg: rgba(16, 16, 30, 0.95);
    --text: #e0e0e0;
    --accent: #4da6ff;
    --accent2: #ff6b6b;
    --gold: #f0c060;
    --violet: #9b7fd4;
    --border: rgba(255,255,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    overflow: hidden;
    height: 100vh;
    width: 100vw;
    user-select: none;
    -webkit-user-select: none;
  }

  #canvas-container {
    position: fixed;
    inset: 0;
    cursor: grab;
  }
  #canvas-container:active { cursor: grabbing; }
  #canvas-container.pointer { cursor: pointer; }

  /* ── Title bar ── */
  #title-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 10;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    pointer-events: none;
  }
  #title-bar > * { pointer-events: auto; }
  #title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.04em;
    text-shadow: 0 0 30px rgba(77,166,255,0.5);
  }
  #title .en {
    font-weight: 400;
    font-size: 0.75rem;
    opacity: 0.6;
    display: block;
    letter-spacing: 0.08em;
  }

  /* ── Buttons ── */
  .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .btn {
    padding: 10px 18px;
    border-radius: 24px;
    border: 1px solid var(--border);
    background: var(--panel-bg);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    font-family: inherit;
    backdrop-filter: blur(12px);
    transition: all 0.25s;
    white-space: nowrap;
  }
  .btn:hover {
    background: rgba(40,40,70,0.9);
    border-color: rgba(255,255,255,0.25);
  }
  .btn.active {
    background: rgba(77,166,255,0.25);
    border-color: var(--accent);
    color: #fff;
    box-shadow: 0 0 16px rgba(77,166,255,0.3);
  }
  .btn.switch-btn {
    background: rgba(155,127,212,0.2);
    border-color: var(--violet);
    color: var(--violet);
  }
  .btn.switch-btn:hover {
    background: rgba(155,127,212,0.35);
    box-shadow: 0 0 20px rgba(155,127,212,0.3);
  }
  .btn.switch-btn.active {
    background: rgba(155,127,212,0.4);
    box-shadow: 0 0 24px rgba(155,127,212,0.5);
  }

  /* ── Legend ── */
  #legend {
    position: fixed;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    z-index: 10;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(16px);
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 220px;
    transition: opacity 0.3s;
  }
  #legend h3 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: rgba(255,255,255,0.5);
    margin-bottom: 6px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 0.82rem;
    color: #bbb;
    border: 1px solid transparent;
  }
  .legend-item:hover {
    background: rgba(255,255,255,0.06);
    color: #fff;
  }
  .legend-item.highlight {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    color: #fff;
    box-shadow: 0 0 12px rgba(0,0,0,0.3);
  }
  .legend-swatch {
    width: 28px; height: 14px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .legend-num {
    font-size: 0.65rem;
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.1);
    color: #888;
    flex-shrink: 0;
  }

  /* ── Detail popup ── */
  #detail-popup {
    position: fixed;
    left: 50%;
    bottom: 40px;
    transform: translateX(-50%);
    z-index: 20;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 32px;
    backdrop-filter: blur(20px);
    max-width: 560px;
    width: 90%;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s, transform 0.35s;
    transform: translateX(-50%) translateY(20px);
  }
  #detail-popup.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #detail-popup .close-btn {
    position: absolute;
    top: 10px; right: 16px;
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 1.2rem;
    padding: 4px 8px;
    border-radius: 50%;
  }
  #detail-popup .close-btn:hover { color: #fff; background: rgba(255,255,255,0.1); }
  #detail-popup h2 {
    font-size: 1.15rem;
    color: #fff;
    margin-bottom: 4px;
  }
  #detail-popup .eng {
    font-size: 0.75rem;
    color: rgba(255,255,255,0.45);
    margin-bottom: 10px;
  }
  #detail-popup p {
    font-size: 0.9rem;
    color: #bbb;
    line-height: 1.6;
  }
  #detail-popup .material-tag {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 12px;
    background: rgba(77,166,255,0.15);
    color: var(--accent);
    font-size: 0.75rem;
    margin: 2px 4px 2px 0;
  }

  /* ── Switch status indicator ── */
  #switch-status {
    position: fixed;
    left: 50%;
    bottom: 130px;
    transform: translateX(-50%);
    z-index: 15;
    padding: 8px 20px;
    border-radius: 20px;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    backdrop-filter: blur(12px);
    font-size: 0.82rem;
    color: #aaa;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.4s;
  }
  #switch-status.visible {
    opacity: 1;
  }
  #switch-status .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }
  #switch-status .dot.off { background: #666; box-shadow: 0 0 4px #666; }
  #switch-status .dot.on { background: #9b7fd4; box-shadow: 0 0 10px #9b7fd4; }

  /* ── Hint ── */
  #hint {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.35);
    font-size: 0.75rem;
    z-index: 5;
    pointer-events: none;
    transition: opacity 1s;
  }

  @media (max-width: 768px) {
    #legend {
      right: 4px; padding: 12px; gap: 2px; min-width: 160px; border-radius: 12px;
    }
    .legend-item { padding: 6px 8px; font-size: 0.7rem; gap: 6px; }
    .legend-swatch { width: 20px; height: 10px; }
    #title { font-size: 1.1rem; }
    .btn { padding: 8px 14px; font-size: 0.75rem; }
    #title-bar { padding: 10px 12px; }
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="title-bar">
  <div id="title">
    电致变色器件
    <span class="en">Electrochromic Device (ECD)</span>
  </div>
  <div class="btn-group">
    <button class="btn active" id="btn-exploded" onclick="window.setView('exploded')">💥 分解视图</button>
    <button class="btn" id="btn-stacked" onclick="window.setView('stacked')">📐 堆叠视图</button>
    <button class="btn switch-btn" id="btn-switch" onclick="window.toggleSwitch()">⚡ 开关变色</button>
    <button class="btn" id="btn-reset" onclick="window.resetCamera()">🔄 重置视角</button>
  </div>
</div>

<div id="legend"><h3>🔬 器件层结构</h3></div>

<div id="detail-popup">
  <button class="close-btn" onclick="window.closeDetail()">✕</button>
  <h2 id="detail-title"></h2>
  <div class="eng" id="detail-eng"></div>
  <p id="detail-desc"></p>
  <div id="detail-materials"></div>
</div>

<div id="switch-status">
  <span class="dot off" id="switch-dot"></span>
  <span id="switch-label">凝胶层：透明</span>
</div>

<div id="hint">🖱 拖动旋转 &nbsp;|&nbsp; 滚轮缩放 &nbsp;|&nbsp; 右键平移 &nbsp;|&nbsp; 点击器件或开关</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ═══════════════════════════════════════
// DATA: 3-layer Electrochromic Device
// ═══════════════════════════════════════
const layers = [
  {
    id: 'ito-glass-top',
    num: 1,
    name: 'ITO透明导电玻璃（上）',
    shortName: 'ITO导电玻璃（上）',
    eng: 'ITO Coated Glass Substrate (Top)',
    desc: '氧化铟锡 (ITO) 镀膜透明导电玻璃。玻璃基底提供结构支撑（透过率 > 90%），ITO薄膜（方块电阻 < 20 Ω/sq）作为工作电极，为凝胶变色层提供均匀电场。二者通过磁控溅射工艺一体成型。',
    materials: ['钠钙玻璃 + ITO (In₂O₃:Sn)', 'FTO导电玻璃', 'AZO导电玻璃'],
    color: 0xa8cfd4,
    opacity: 0.52,
    thickness: 0.35,
    metalness: 0.08,
    roughness: 0.18,
    clearcoat: 0.4,
  },
  {
    id: 'gel-layer',
    num: 2,
    name: '凝胶变色层（中间）',
    shortName: '凝胶变色层',
    eng: 'Gel Electrochromic Layer',
    desc: '器件核心——由电致变色材料、电解质和离子存储材料复合而成的一体化凝胶层。施加电压时 Li⁺ 离子注入，凝胶由透明转为紫罗兰色。断电后颜色保持（双稳态），反向电压恢复透明。',
    materials: ['WO₃/PEDOT:PSS 电致变色剂', 'LiClO₄/PC 电解质', 'NiO/CeO₂ 离子存储剂', 'PMMA 凝胶基质'],
    color: 0xe8dfd0,
    colorOn: 0x8b6fc0,      // 紫罗兰色 (violet)
    opacity: 0.58,
    thickness: 0.45,
    metalness: 0.0,
    roughness: 0.55,
    isGel: true,
  },
  {
    id: 'ito-glass-bottom',
    num: 3,
    name: 'ITO透明导电玻璃（下）',
    shortName: 'ITO导电玻璃（下）',
    eng: 'ITO Coated Glass Substrate (Bottom)',
    desc: '底部 ITO 导电玻璃，与上层对称。作为对电极，施加反向电压时驱动 Li⁺ 从凝胶层迁回，器件恢复透明——实现可逆变色。通过边缘树脂密封与上层形成密闭腔体。',
    materials: ['钠钙玻璃 + ITO (In₂O₃:Sn)', 'FTO导电玻璃', 'AZO导电玻璃'],
    color: 0xa8cfd4,
    opacity: 0.52,
    thickness: 0.35,
    metalness: 0.08,
    roughness: 0.18,
    clearcoat: 0.4,
  },
];

// ═══════════════════════════════════════
// THREE.JS SETUP
// ═══════════════════════════════════════
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0a18);
scene.fog = new THREE.Fog(0x0a0a18, 12, 42);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.5, 60);
camera.position.set(5, 3.5, 9);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
container.appendChild(renderer.domElement);

// ── Lighting ──
scene.add(new THREE.AmbientLight(0x334466, 2.5));

const keyLight = new THREE.DirectionalLight(0xffffff, 6);
keyLight.position.set(8, 12, 8);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 60;
keyLight.shadow.camera.left = -10;
keyLight.shadow.camera.right = 10;
keyLight.shadow.camera.top = 10;
keyLight.shadow.camera.bottom = -10;
keyLight.shadow.bias = -0.0001;
scene.add(keyLight);

scene.add(new THREE.DirectionalLight(0x8899cc, 2)).position.set(-4, 2, -3);
scene.add(new THREE.DirectionalLight(0xaaccff, 3)).position.set(0, -1, 6);

const topLight = new THREE.PointLight(0xffffff, 8, 15);
topLight.position.set(0, 8, 0);
scene.add(topLight);

// ── Ground shadow plane ──
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.ShadowMaterial({ opacity: 0.25 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -5;
ground.receiveShadow = true;
scene.add(ground);

// ── Particle field ──
const particlesGeo = new THREE.BufferGeometry();
const particlesCount = 400;
const posArr = new Float32Array(particlesCount * 3);
for (let i = 0; i < particlesCount; i++) {
  posArr[i * 3] = (Math.random() - 0.5) * 16;
  posArr[i * 3 + 1] = (Math.random() - 0.5) * 10;
  posArr[i * 3 + 2] = (Math.random() - 0.5) * 12;
}
particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
const particles = new THREE.Points(particlesGeo, new THREE.PointsMaterial({
  size: 0.015, color: 0x4488cc, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(particles);

// ═══════════════════════════════════════
// BUILD DEVICE
// ═══════════════════════════════════════
const deviceGroup = new THREE.Group();
scene.add(deviceGroup);

const WIDTH = 3.2;
const DEPTH = 2.0;

// ── Core layer meshes ──
const layerMeshes = [];

layers.forEach((layer, index) => {
  const geo = new THREE.BoxGeometry(WIDTH, layer.thickness, DEPTH, 2, 1, 2);
  const mat = new THREE.MeshPhysicalMaterial({
    color: new THREE.Color(layer.color),
    metalness: layer.metalness,
    roughness: layer.roughness,
    transparent: true,
    opacity: layer.opacity,
    envMapIntensity: 0.35,
    clearcoat: layer.clearcoat || 0,
    clearcoatRoughness: 0.1,
    specularIntensity: 0.5,
    specularColor: new THREE.Color(0xffffff),
  });

  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.userData = { layerIndex: index, layerData: layer };

  // Wireframe edges for definition
  const edgeGeo = new THREE.EdgesGeometry(geo);
  const edges = new THREE.LineSegments(edgeGeo, new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.12, depthTest: true,
  }));
  mesh.add(edges);

  layerMeshes.push(mesh);
  deviceGroup.add(mesh);
});

// ── Resin Frame (black border around device, only in stacked view) ──
const frameGroup = new THREE.Group();
deviceGroup.add(frameGroup);

const FRAME_BAR_W = 0.22;   // frame bar thickness
const FRAME_H = layers.reduce((s, l) => s + l.thickness, 0); // same as total core thickness
const FRAME_OUTER_W = WIDTH + FRAME_BAR_W * 2;
const FRAME_OUTER_D = DEPTH + FRAME_BAR_W * 2;

function buildFrameBars() {
  const mat = new THREE.MeshStandardMaterial({
    color: 0x1a1a1c,
    metalness: 0.05,
    roughness: 0.7,
  });

  const hw = FRAME_OUTER_W / 2;
  const hd = FRAME_OUTER_D / 2;
  const hCoreW = WIDTH / 2;
  const hCoreD = DEPTH / 2;

  // Each bar sits centered along one edge
  const barSpecs = [
    // front bar (along +Z edge)
    { w: FRAME_OUTER_W, d: FRAME_BAR_W, x: 0, z: hCoreD + FRAME_BAR_W / 2 },
    // back bar (along -Z edge)
    { w: FRAME_OUTER_W, d: FRAME_BAR_W, x: 0, z: -hCoreD - FRAME_BAR_W / 2 },
    // right bar (along +X edge, between front/back)
    { w: FRAME_BAR_W, d: DEPTH, x: hCoreW + FRAME_BAR_W / 2, z: 0 },
    // left bar (along -X edge)
    { w: FRAME_BAR_W, d: DEPTH, x: -hCoreW - FRAME_BAR_W / 2, z: 0 },
  ];

  barSpecs.forEach(spec => {
    const geo = new THREE.BoxGeometry(spec.w, FRAME_H, spec.d);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(spec.x, 0, spec.z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    frameGroup.add(mesh);
  });
}
buildFrameBars();

// ── Resin Base (platform under device, only in stacked view) ──
const baseGroup = new THREE.Group();
deviceGroup.add(baseGroup);

const BASE_W = 4.2;
const BASE_D = 3.0;
const BASE_H = 0.28;

const baseGeo = new THREE.BoxGeometry(BASE_W, BASE_H, BASE_D, 1, 1, 1);
const baseMat = new THREE.MeshStandardMaterial({
  color: 0x1c1c1e,
  metalness: 0.08,
  roughness: 0.65,
});
const baseMesh = new THREE.Mesh(baseGeo, baseMat);
baseMesh.castShadow = true;
baseMesh.receiveShadow = true;
baseMesh.userData = { isBase: true };
baseGroup.add(baseMesh);

// ── Subtle beveled top plate on base ──
const basePlateGeo = new THREE.BoxGeometry(BASE_W - 0.15, 0.06, BASE_D - 0.15, 1, 1, 1);
const basePlateMat = new THREE.MeshStandardMaterial({
  color: 0x242426,
  metalness: 0.1,
  roughness: 0.5,
});
const basePlate = new THREE.Mesh(basePlateGeo, basePlateMat);
basePlate.position.y = BASE_H / 2 + 0.03;
basePlate.receiveShadow = true;
baseGroup.add(basePlate);

// ── Switch on the base ──
const switchGroup = new THREE.Group();
switchGroup.userData = { isSwitch: true };
baseGroup.add(switchGroup);

// Switch housing
const switchHousingGeo = new THREE.CylinderGeometry(0.14, 0.16, 0.14, 32);
const switchHousingMat = new THREE.MeshStandardMaterial({
  color: 0x2a2a2c, metalness: 0.3, roughness: 0.4,
});
const switchHousing = new THREE.Mesh(switchHousingGeo, switchHousingMat);
switchHousing.position.y = 0.07;
switchHousing.castShadow = true;
switchHousing.receiveShadow = true;
switchGroup.add(switchHousing);

// Switch toggle lever
const toggleGroup = new THREE.Group();
toggleGroup.position.y = 0.14;
switchGroup.add(toggleGroup);

const toggleBaseGeo = new THREE.SphereGeometry(0.06, 16, 8);
const toggleBaseMat = new THREE.MeshStandardMaterial({
  color: 0xcccccc, metalness: 0.7, roughness: 0.25,
});
const toggleBase = new THREE.Mesh(toggleBaseGeo, toggleBaseMat);
toggleGroup.add(toggleBase);

const toggleLeverGeo = new THREE.CylinderGeometry(0.025, 0.035, 0.2, 12);
const toggleLever = new THREE.Mesh(toggleLeverGeo, toggleBaseMat);
toggleLever.position.y = 0.1;
toggleLever.castShadow = true;
toggleGroup.add(toggleLever);

// Small indicator LED on switch base
const ledGeo = new THREE.SphereGeometry(0.025, 16, 8);
const ledOffMat = new THREE.MeshStandardMaterial({
  color: 0x442222, emissive: 0x220000, emissiveIntensity: 0.5, roughness: 0.3,
});
const ledOnMat = new THREE.MeshStandardMaterial({
  color: 0x9966dd, emissive: 0x6633aa, emissiveIntensity: 2.0, roughness: 0.3,
});
const ledDot = new THREE.Mesh(ledGeo, ledOffMat);
ledDot.position.set(0.08, 0.10, 0);
switchGroup.add(ledDot);

// Position switch on the base front-right
switchGroup.position.set(BASE_W * 0.28, BASE_H / 2 + 0.06, BASE_D * 0.28);

// ── Dashed lines for exploded view ──
const dashGroup = new THREE.Group();
deviceGroup.add(dashGroup);

function createDashedLine(y1, y2) {
  const pts = [new THREE.Vector3(0, y1, 0), new THREE.Vector3(0, y2, 0)];
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  const mat = new THREE.LineDashedMaterial({
    color: 0x667799, dashSize: 0.15, gapSize: 0.1, transparent: true, opacity: 0.5,
  });
  const line = new THREE.Line(geo, mat);
  line.computeLineDistances();
  return line;
}

function updateDashLines(exploded) {
  while (dashGroup.children.length > 0) dashGroup.remove(dashGroup.children[0]);
  if (!exploded) return;

  for (let i = 0; i < layerMeshes.length - 1; i++) {
    const a = layerMeshes[i], b = layerMeshes[i + 1];
    const y1 = a.position.y + layers[i].thickness / 2;
    const y2 = b.position.y - layers[i + 1].thickness / 2;
    [1, -1].forEach(sign => {
      const line = createDashedLine(y1, y2);
      line.position.set(sign * WIDTH * 0.4, 0, sign * DEPTH * 0.35);
      dashGroup.add(line);
    });
  }
}

// ── Labels (sprites) — only in exploded view ──
const labelSprites = [];

function createLabel(text, position) {
  const canvas = document.createElement('canvas');
  canvas.width = 512;
  canvas.height = 128;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = 'rgba(10,10,24,0.85)';
  roundRect(ctx, 40, 20, 432, 88, 20);
  ctx.fill();

  ctx.strokeStyle = 'rgba(255,255,255,0.2)';
  ctx.lineWidth = 2;
  roundRect(ctx, 40, 20, 432, 88, 20);
  ctx.stroke();

  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 32px "PingFang SC","Microsoft YaHei","Segoe UI",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 256, 64);

  const texture = new THREE.CanvasTexture(canvas);
  texture.minFilter = THREE.LinearFilter;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: texture, transparent: true, depthTest: false, depthWrite: false,
  }));
  sprite.position.copy(position);
  sprite.scale.set(2.0, 0.5, 1);
  return sprite;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function updateLabels(exploded) {
  labelSprites.forEach(s => deviceGroup.remove(s));
  labelSprites.length = 0;
  if (!exploded) return;

  layerMeshes.forEach((mesh, i) => {
    const y = mesh.position.y;
    const label = createLabel(layers[i].name, new THREE.Vector3(WIDTH / 2 + 0.9, y, 0));
    label.userData = { layerIndex: i };
    deviceGroup.add(label);
    labelSprites.push(label);
  });
}

// ═══════════════════════════════════════
// LAYOUT: Stacked vs Exploded
// ═══════════════════════════════════════
let currentView = 'exploded';
let switchOn = false; // gel color state

function layoutStacked() {
  const coreH = layers.reduce((s, l) => s + l.thickness, 0);

  // Position layers stacked (centered above base)
  const stackBottom = BASE_H / 2 + 0.08;
  let y = stackBottom;
  layerMeshes.forEach((mesh, i) => {
    y += layers[i].thickness / 2;
    mesh.position.y = y;
    y += layers[i].thickness / 2;
  });

  // Position frame at same height as the layer stack
  const frameCenterY = stackBottom + coreH / 2;
  frameGroup.position.y = frameCenterY;
  frameGroup.visible = true;

  // Position base below
  baseGroup.position.y = 0;
  baseGroup.visible = true;

  // Recenter the whole device so base center is at y=0
  const offsetY = -(stackBottom + coreH / 2);
  deviceGroup.position.y = offsetY;
}

function layoutExploded() {
  const gap = 0.65;
  const totalH = layers.reduce((s, l) => s + l.thickness, 0) + (layers.length - 1) * gap;

  let y = -totalH / 2;
  layerMeshes.forEach((mesh, i) => {
    y += layers[i].thickness / 2;
    mesh.position.y = y;
    y += layers[i].thickness / 2 + gap;
  });

  // Hide frame and base in exploded view
  frameGroup.visible = false;
  baseGroup.visible = false;
  deviceGroup.position.y = 0;

  // Hide switch status
  document.getElementById('switch-status').classList.remove('visible');
}

function setView(view) {
  currentView = view;
  document.getElementById('btn-exploded').classList.toggle('active', view === 'exploded');
  document.getElementById('btn-stacked').classList.toggle('active', view === 'stacked');

  if (view === 'exploded') {
    layoutExploded();
  } else {
    layoutStacked();
    updateSwitchStatusUI();
  }
  updateDashLines(view === 'exploded');
  updateLabels(view === 'exploded');
}

// ═══════════════════════════════════════
// SWITCH TOGGLE — gel color change
// ═══════════════════════════════════════
function toggleSwitch() {
  switchOn = !switchOn;
  updateGelColor();
  updateSwitchVisual();
  updateSwitchStatusUI();

  const btn = document.getElementById('btn-switch');
  btn.classList.toggle('active', switchOn);
  btn.textContent = switchOn ? '⚡ 关 — 褪色' : '⚡ 开关变色';
}

function updateGelColor() {
  const gelMesh = layerMeshes[1]; // index 1 = gel layer
  const gelData = layers[1];
  if (switchOn) {
    gelMesh.material.color.set(gelData.colorOn);
    gelMesh.material.opacity = 0.82;
    gelMesh.material.emissive = new THREE.Color(gelData.colorOn);
    gelMesh.material.emissiveIntensity = 0.25;
  } else {
    gelMesh.material.color.set(gelData.color);
    gelMesh.material.opacity = gelData.opacity;
    gelMesh.material.emissive = new THREE.Color(0x000000);
    gelMesh.material.emissiveIntensity = 0;
  }
}

function updateSwitchVisual() {
  // Toggle the lever angle
  toggleGroup.rotation.x = switchOn ? -0.5 : 0.5;

  // Update LED color
  if (switchOn) {
    ledDot.material = ledOnMat.clone();
  } else {
    ledDot.material = ledOffMat.clone();
  }
}

function updateSwitchStatusUI() {
  const status = document.getElementById('switch-status');
  const dot = document.getElementById('switch-dot');
  const label = document.getElementById('switch-label');

  if (currentView === 'stacked') {
    status.classList.add('visible');
    dot.className = 'dot ' + (switchOn ? 'on' : 'off');
    label.textContent = switchOn ? '凝胶层：紫罗兰色 (着色态)' : '凝胶层：透明 (褪色态)';
  } else {
    status.classList.remove('visible');
  }
}

// ═══════════════════════════════════════
// ORBIT CONTROLS
// ═══════════════════════════════════════
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0, 0);
controls.minDistance = 4;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.75;
controls.minPolarAngle = Math.PI * 0.15;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.update();

function resetCamera() {
  camera.position.set(5, 3.5, 9);
  controls.target.set(0, 0, 0);
  controls.update();
}

// ═══════════════════════════════════════
// RAYCASTER — Click & hover
// ═══════════════════════════════════════
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredLayer = null;
let selectedLayer = null;

function getIntersections(event) {
  mouse.x = (event.clientX / container.clientWidth) * 2 - 1;
  mouse.y = -(event.clientY / container.clientHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  // Include layers, switch, and base
  const targets = [...layerMeshes, switchGroup, baseMesh];
  return raycaster.intersectObjects(targets, true);
}

container.addEventListener('mousemove', (event) => {
  const hits = getIntersections(event);
  if (hits.length > 0) {
    // Walk up to find userData
    let obj = hits[0].object;
    while (obj) {
      if (obj.userData && (obj.userData.layerData || obj.userData.isSwitch || obj.userData.isBase)) break;
      obj = obj.parent;
    }

    if (obj && obj.userData.isSwitch) {
      container.classList.add('pointer');
      if (hoveredLayer) { resetHighlight(); hoveredLayer = null; }
      return;
    }

    if (obj && obj.userData.layerData) {
      container.classList.add('pointer');
      if (hoveredLayer !== obj) {
        resetHighlight();
        hoveredLayer = obj;
        highlightLayer(obj, true);
      }
      return;
    }
  }

  container.classList.remove('pointer');
  if (hoveredLayer) { resetHighlight(); hoveredLayer = null; }
  updateLegendHighlight(null);
});

container.addEventListener('click', (event) => {
  const hits = getIntersections(event);
  if (hits.length > 0) {
    let obj = hits[0].object;
    while (obj) {
      if (obj.userData && obj.userData.isSwitch) {
        toggleSwitch();
        return;
      }
      if (obj.userData && obj.userData.layerData) {
        selectLayer(obj);
        return;
      }
      obj = obj.parent;
    }
  }
});

function highlightLayer(mesh, on) {
  const idx = mesh.userData.layerIndex;
  const layer = layers[idx];
  // Don't override gel color if switch is on
  if (on) {
    mesh.material.emissive = new THREE.Color(layer.color);
    mesh.material.emissiveIntensity = 0.4;
    mesh.material.opacity = Math.min(layer.opacity + 0.2, 0.95);
    mesh.scale.set(1.04, 1, 1.04);
  } else {
    mesh.material.emissive = new THREE.Color(0x000000);
    mesh.material.emissiveIntensity = 0;
    mesh.material.opacity = (idx === 1 && switchOn) ? 0.82 : layer.opacity;
    mesh.scale.set(1, 1, 1);
    if (idx === 1 && switchOn) {
      mesh.material.color.set(layer.colorOn);
      mesh.material.emissive = new THREE.Color(layer.colorOn);
      mesh.material.emissiveIntensity = 0.25;
    } else if (idx === 1) {
      mesh.material.color.set(layer.color);
    }
  }
  updateLegendHighlight(on ? idx : null);
}

function resetHighlight() {
  layerMeshes.forEach((mesh, i) => {
    mesh.material.emissive = new THREE.Color(0x000000);
    mesh.material.emissiveIntensity = 0;
    mesh.material.opacity = (i === 1 && switchOn) ? 0.82 : layers[i].opacity;
    mesh.scale.set(1, 1, 1);
    if (i === 1 && switchOn) {
      mesh.material.color.set(layers[i].colorOn);
      mesh.material.emissive = new THREE.Color(layers[i].colorOn);
      mesh.material.emissiveIntensity = 0.25;
    } else if (i === 1) {
      mesh.material.color.set(layers[i].color);
    }
  });
}

function selectLayer(mesh) {
  const idx = mesh.userData.layerIndex;
  const layer = layers[idx];

  if (selectedLayer === mesh) { closeDetail(); return; }
  if (selectedLayer) resetHighlight();

  selectedLayer = mesh;
  highlightLayer(mesh, true);

  document.getElementById('detail-title').textContent = `第 ${layer.num} 层 — ${layer.name}`;
  document.getElementById('detail-eng').textContent = layer.eng;
  document.getElementById('detail-desc').textContent = layer.desc;
  document.getElementById('detail-materials').innerHTML = layer.materials.map(m =>
    `<span class="material-tag">${m}</span>`
  ).join(' ');
  document.getElementById('detail-popup').classList.add('visible');

  const worldPos = new THREE.Vector3();
  mesh.getWorldPosition(worldPos);
  animateCamera(new THREE.Vector3(worldPos.x + 4, worldPos.y, 5.5), worldPos);
}

function closeDetail() {
  document.getElementById('detail-popup').classList.remove('visible');
  if (selectedLayer) { resetHighlight(); selectedLayer = null; }
  updateLegendHighlight(null);
}

function animateCamera(targetPos, lookTarget) {
  const startPos = camera.position.clone();
  const startLook = controls.target.clone();
  const startTime = performance.now();
  const duration = 800;
  function step(time) {
    const elapsed = time - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    camera.position.lerpVectors(startPos, targetPos, ease);
    controls.target.lerpVectors(startLook, lookTarget, ease);
    controls.update();
    if (t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

// ═══════════════════════════════════════
// LEGEND
// ═══════════════════════════════════════
const legendEl = document.getElementById('legend');

layers.forEach((layer, i) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.dataset.index = i;
  const hex = '#' + new THREE.Color(layer.color).getHexString();
  item.innerHTML = `
    <span class="legend-num">${layer.num}</span>
    <span class="legend-swatch" style="background:${hex};opacity:0.8"></span>
    <span>${layer.shortName}</span>
  `;
  item.addEventListener('click', () => selectLayer(layerMeshes[i]));
  item.addEventListener('mouseenter', () => {
    if (!selectedLayer || selectedLayer !== layerMeshes[i]) {
      resetHighlight();
      highlightLayer(layerMeshes[i], true);
      hoveredLayer = layerMeshes[i];
      container.classList.add('pointer');
    }
  });
  item.addEventListener('mouseleave', () => {
    if (!selectedLayer || selectedLayer !== layerMeshes[i]) {
      resetHighlight();
      hoveredLayer = null;
      container.classList.remove('pointer');
    }
  });
  legendEl.appendChild(item);
});

function updateLegendHighlight(idx) {
  Array.from(legendEl.querySelectorAll('.legend-item')).forEach((el, i) => {
    el.classList.toggle('highlight', i === idx);
  });
}

// ═══════════════════════════════════════
// RENDER LOOP
// ═══════════════════════════════════════
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  controls.update();

  // Pulse selected layer
  if (selectedLayer) {
    const pulse = 1 + Math.sin(performance.now() * 0.005) * 0.015;
    selectedLayer.scale.set(pulse, 1, pulse);
  }

  // Pulse LED when switch is on
  if (switchOn && currentView === 'stacked') {
    const ledPulse = 1 + Math.sin(performance.now() * 0.008) * 0.4;
    ledDot.material.emissiveIntensity = 2.0 * ledPulse;
  }

  // Rotate particles
  particles.rotation.y += dt * 0.04;
  particles.rotation.x += dt * 0.02;

  renderer.render(scene, camera);
}

// ═══════════════════════════════════════
// EVENTS
// ═══════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

window.addEventListener('keydown', (e) => {
  switch (e.key.toLowerCase()) {
    case 'e': setView('exploded'); break;
    case 's': setView('stacked'); break;
    case 'a': toggleSwitch(); break;
    case 'r': resetCamera(); break;
    case 'escape': closeDetail(); break;
    case '1': selectLayer(layerMeshes[0]); break;
    case '2': selectLayer(layerMeshes[1]); break;
    case '3': selectLayer(layerMeshes[2]); break;
  }
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
layoutExploded();
updateDashLines(true);
updateLabels(true);

setTimeout(() => {
  document.getElementById('hint').style.opacity = '0';
  setTimeout(() => document.getElementById('hint').remove(), 1000);
}, 8000);

animate();

// Expose to window
window.setView = setView;
window.resetCamera = resetCamera;
window.toggleSwitch = toggleSwitch;
window.closeDetail = closeDetail;

console.log('  层结构：ITO导电玻璃(上) → 凝胶变色层 → ITO导电玻璃(下)');
console.log('  🖱 拖动旋转 | 滚轮缩放 | 右键平移');
console.log('  ⌨ E=分解 S=堆叠 A=开关变色 R=重置 1-3=选择层');
console.log('  💡 堆叠视图：点击底座开关 → 凝胶层变紫罗兰色');
</script>
